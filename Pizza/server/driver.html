<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pizza Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: #2a2a2a;
      --orange: #ff6a00;
      --orange-dim: rgba(255, 106, 0, 0.12);
      --orange-glow: rgba(255, 106, 0, 0.35);
      --text: #f0ece4;
      --text-muted: #6b6660;
      --text-dim: #9b9690;
      --green: #4caf79;
      --green-dim: rgba(76, 175, 121, 0.12);
      --red: #e05c5c;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    #login-screen::before {
      content: '';
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,106,0,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 3.5rem;
      letter-spacing: -0.02em;
      color: var(--orange);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .login-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3.5rem;
    }

    .login-form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: block;
    }

    .login-input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .login-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-dim);
    }

    .login-input::placeholder { color: var(--text-muted); }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: var(--orange);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .login-btn:active { transform: scale(0.97); opacity: 0.9; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-error {
      color: var(--red);
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2rem;
    }

    /* ── APP SCREEN ── */
    #app-screen {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* Header */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .driver-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .driver-name span {
      color: var(--orange);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Progress bar */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* No route state */
    .no-route {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      text-align: center;
      gap: 1rem;
    }

    .no-route-icon {
      font-size: 3rem;
      opacity: 0.3;
    }

    .no-route-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .no-route-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Stop list */
    .stops-list {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 2rem;
    }

    .stop-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      transition: border-color 0.2s, opacity 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stop-card.pending {
      border-color: var(--border);
    }

    .stop-card.next {
      border-color: var(--orange);
      box-shadow: 0 0 0 1px var(--orange-glow), inset 0 0 30px var(--orange-dim);
    }

    .stop-card.delivered {
      opacity: 0.4;
      border-color: var(--border);
    }

    .stop-card.delivered .stop-address,
    .stop-card.delivered .stop-customer {
      text-decoration: line-through;
    }

    .stop-num {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .stop-card.next .stop-num {
      color: var(--orange);
      font-weight: 700;
    }

    .stop-tag {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .stop-tag.tag-next { background: var(--orange-dim); color: var(--orange); }
    .stop-tag.tag-pending { background: var(--surface2); color: var(--text-muted); }
    .stop-tag.tag-done { background: var(--green-dim); color: var(--green); }

    .stop-customer {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }

    .stop-address {
      font-size: 0.875rem;
      color: var(--text-dim);
      line-height: 1.4;
      margin-bottom: 0.9rem;
    }

    .stop-actions {
      display: flex;
      gap: 0.6rem;
    }

    .btn-nav {
      flex: 1;
      padding: 0.65rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: background 0.15s, color 0.15s;
    }

    .btn-nav:active { background: var(--border); }

    .btn-deliver {
      flex: 2;
      padding: 0.65rem 1rem;
      background: var(--orange);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-deliver:active { transform: scale(0.96); opacity: 0.85; }
    .btn-deliver:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Delivered checkmark overlay */
    .delivered-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--green);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* All done state */
    .all-done {
      margin: 1rem;
      padding: 1.5rem;
      background: var(--green-dim);
      border: 1.5px solid rgba(76, 175, 121, 0.3);
      border-radius: 12px;
      text-align: center;
    }

    .all-done-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 0.3rem;
    }

    .all-done-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 1.25rem;
      font-size: 0.875rem;
      color: var(--text-dim);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { color: var(--green); border-color: rgba(76,175,121,0.3); }

    /* Pulse animation for next stop */
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 1px var(--orange-glow), inset 0 0 30px var(--orange-dim); }
      50% { box-shadow: 0 0 0 3px var(--orange-glow), inset 0 0 40px rgba(255,106,0,0.15); }
    }

    .stop-card.next { animation: pulse-border 2.5s ease-in-out infinite; }

    /* Fade in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stop-card { animation: fadeUp 0.3s ease both; }
    .stop-card:nth-child(1) { animation-delay: 0.05s; }
    .stop-card:nth-child(2) { animation-delay: 0.1s; }
    .stop-card:nth-child(3) { animation-delay: 0.15s; }
    .stop-card:nth-child(4) { animation-delay: 0.2s; }
    .stop-card:nth-child(5) { animation-delay: 0.25s; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">🍕 PIZZERIA</div>
  <div class="login-sub">Driver App · Singen</div>
  <form class="login-form" id="login-form">
    <div>
      <label class="login-label" for="name-input">Your name</label>
      <input
        id="name-input"
        class="login-input"
        type="text"
        placeholder="e.g. Marco"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        required
      />
    </div>
    <button class="login-btn" type="submit" id="login-btn">Start Shift</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- APP -->
<div id="app-screen">
  <header class="app-header">
    <div class="header-top">
      <div class="driver-name">Hey, <span id="display-name">—</span></div>
      <button class="logout-btn" id="logout-btn">Sign out</button>
    </div>
    <div class="progress-row">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 0</div>
    </div>
  </header>

  <div id="stops-container"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const BASE = '';
  let driverData = null;
  let eventSource = null;

  // ── DOM refs ──
  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const nameInput = document.getElementById('name-input');
  const displayName = document.getElementById('display-name');
  const progressFill = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');
  const stopsContainer = document.getElementById('stops-container');
  const logoutBtn = document.getElementById('logout-btn');
  const toast = document.getElementById('toast');

  // ── Toast ──
  let toastTimer;
  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2500);
  }

  // ── Login ──
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    loginError.textContent = '';
    try {
      const res = await fetch(`${BASE}/api/driver/login?name=${encodeURIComponent(name)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      driverData = data;
      enterApp();
    } catch (err) {
      loginError.textContent = err.message;
      loginBtn.disabled = false;
      loginBtn.textContent = 'Start Shift';
    }
  });

  // ── Logout ──
  logoutBtn.addEventListener('click', () => {
    if (eventSource) { eventSource.close(); eventSource = null; }
    driverData = null;
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    nameInput.value = '';
    loginBtn.textContent = 'Start Shift';
    loginBtn.disabled = false;
  });

  // ── Enter app ──
  function enterApp() {
    loginScreen.style.display = 'none';
    appScreen.style.display = 'flex';
    displayName.textContent = driverData.driver.name;
    renderStops(driverData.stops);
    subscribeSSE(driverData.driver.id);
  }

  // ── SSE ──
  function subscribeSSE(driverId) {
    if (eventSource) eventSource.close();
    eventSource = new EventSource(`${BASE}/api/events`);
    eventSource.onmessage = async (e) => {
      const evt = JSON.parse(e.data);
      if (evt.type === 'route_assigned' && evt.route?.driver_id === driverId) {
        // Refresh driver data
        const res = await fetch(`${BASE}/api/driver/login?name=${encodeURIComponent(driverData.driver.name)}`);
        driverData = await res.json();
        renderStops(driverData.stops);
        showToast('New route assigned!', 'success');
      }
      if (evt.type === 'route_completed' && driverData.route && evt.routeId === driverData.route.id) {
        showToast('Route complete — good work! 🎉', 'success');
      }
    };
  }

  // ── Render stops ──
  function renderStops(stops) {
    stopsContainer.innerHTML = '';

    const delivered = stops.filter(s => s.status === 'delivered').length;
    const total = stops.length;
    const pct = total ? Math.round((delivered / total) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `${delivered} / ${total}`;

    if (!stops || stops.length === 0) {
      stopsContainer.innerHTML = `
        <div class="no-route">
          <div class="no-route-icon">🛵</div>
          <div class="no-route-title">No active route</div>
          <div class="no-route-sub">The manager will assign your deliveries shortly. Hang tight.</div>
        </div>`;
      return;
    }

    const allDone = stops.every(s => s.status === 'delivered');
    if (allDone) {
      stopsContainer.innerHTML = `
        <div class="all-done">
          <div class="all-done-title">All delivered ✓</div>
          <div class="all-done-sub">Route complete. Head back to the pizzeria.</div>
        </div>`;
    }

    const list = document.createElement('div');
    list.className = 'stops-list';

    // Find next undelivered
    const nextIdx = stops.findIndex(s => s.status !== 'delivered');

    stops.forEach((stop, i) => {
      const isDone = stop.status === 'delivered';
      const isNext = i === nextIdx;

      const card = document.createElement('div');
      card.className = `stop-card ${isDone ? 'delivered' : isNext ? 'next' : 'pending'}`;
      card.dataset.id = stop.id;

      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(stop.address)}`;
      const wazeUrl = `https://waze.com/ul?ll=${stop.lat},${stop.lng}&navigate=yes`;

      card.innerHTML = `
        <div class="stop-num">#${i + 1}</div>
        <div class="stop-tag ${isDone ? 'tag-done' : isNext ? 'tag-next' : 'tag-pending'}">
          ${isDone ? '✓ Delivered' : isNext ? 'Next stop' : 'Upcoming'}
        </div>
        <div class="stop-customer">${escHtml(stop.customer_name)}</div>
        <div class="stop-address">${escHtml(stop.address)}</div>
        ${isDone
          ? `<div class="delivered-badge"><span>✓</span> Done</div>`
          : `<div class="stop-actions">
              <a class="btn-nav" href="${mapsUrl}" target="_blank">🗺 Maps</a>
              <a class="btn-nav" href="${wazeUrl}" target="_blank">🔵 Waze</a>
              <button class="btn-deliver" data-id="${stop.id}">Mark Delivered</button>
            </div>`
        }
      `;

      list.appendChild(card);
    });

    stopsContainer.appendChild(list);

    // Bind deliver buttons
    list.querySelectorAll('.btn-deliver').forEach(btn => {
      btn.addEventListener('click', () => markDelivered(btn.dataset.id, btn));
    });
  }

  // ── Mark delivered ──
  async function markDelivered(orderId, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`${BASE}/api/orders/${orderId}/deliver`, { method: 'PATCH' });
      if (!res.ok) throw new Error('Failed');

      // Update local state
      const stop = driverData.stops.find(s => s.id == orderId);
      if (stop) stop.status = 'delivered';
      renderStops(driverData.stops);
      showToast('Delivery confirmed ✓', 'success');
    } catch {
      btn.disabled = false;
      btn.textContent = 'Mark Delivered';
      showToast('Failed — try again');
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
